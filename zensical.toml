use_directory_urls = false
extra_css = ["stylesheets.css"]
nav = [
  { "Home" = "index.md" },
  { "Release Notes" = "release-notes.md" },
  { "User Manual" = [
    { "1 Overview" = "manual/0100-overview.md" },
    { "2 Installing AGL" = "manual/0200-installing-agl.md" },
    { "3 Configuration" = "manual/0300-configuration.md" },
    { "4 Initialisation" = "manual/0400-initialisation.md" },
    { "5 Using AGL" = "manual/0500-using-agl.md" },
    { "6 DC Data Table" = "manual/0600-dc-data-table.md" },
    { "7 NOAA Server" = "manual/0700-noaa-server.md" },
    { "8 Chats" = "manual/0800-chats.md" },
    { "9 Simulator" = "manual/0900-simulator.md" },
    { "10 Known Issues and Bugs" = "manual/1000-known-issues-and-bugs.md" },
    { "11 Acknowledgements" = "manual/1100-acknowledgements.md" },
  ] },
]

[project.theme]
language = "en"
features = ["navigation.sections", "navigation.instant", "content.code.copy", "navigation.top"]
